<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2fa8">
<script>try{var p=localStorage.getItem("mrx-theme")||"auto";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p}catch(e){}</script>
<title>Mister X London</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE game night: clear and friendly; every phone shows only what its own player needs
   IDEA a modern London transit map: white ground, bold coloured lines, a roundel-blue signage bar
   PICTURE the live map with pins; your reachable stations glow, plus a big tap list of destinations
   COLOUR white map, signage blue, taxi yellow, bus green, tube red, Mister X black
   TYPE Outfit throughout (geometric, transit-sign feel), four sizes
   LAYOUT phone: blue bar, map, bottom sheet with tabs; laptop: map left, 400px panel right */
:root{color-scheme:light;--bar:#0b2fa8;--blue:#0b2fa8;--pri:#0b2fa8;--prih:#0a2790;--blue2:#e9eefc;--ink:#111522;--mute:#5b6375;--line:#e2e5eb;--soft:#f3f5f8;--bg:#fff;--card:#fff;--taxi:#ffc400;--taxiL:#d99c00;--bus:#12a04c;--ug:#e1251b;--blk:#0b0b0b;--boat:#2b7dd0;--ok:#12a04c;--warn:#e08a00;--alertBg:#fff4d6;--alertInk:#7a4b00;
--mOut:#e7e3da;--mGround:#f1ede4;--mMinor:#fff;--mMain:#fff;--mMainE:#ddd5c6;--mPark:#d6eac5;--mParkE:#c2dcae;--mRiver:#b9dbf1;--mRiverE:#97c6e6;--mStFill:#fff;--mStInk:#111522;--mStEdge:#111522;--mName:#4b5260;--mHalo:#f1ede4;--mDist:rgba(92,80,58,.2);--mLm:#9097a5;--mRv:#4f8dbd;--ghost:rgba(255,255,255,.92);--ghostE:#0b0b0b}
:root[data-theme=dark]{color-scheme:dark;--bar:#0d1838;--blue:#6f93ff;--pri:#3d6cf5;--prih:#5a82ff;--blue2:#1a2444;--ink:#eef1f7;--mute:#9aa3b5;--line:#2b3240;--soft:#1d232e;--bg:#11151c;--card:#181d26;--taxiL:#e6b020;--bus:#22b65d;--ug:#f0443a;--boat:#4a9bea;--alertBg:#3a2e10;--alertInk:#ffd27a;
--mOut:#0d1016;--mGround:#161b23;--mMinor:#20262f;--mMain:#28303b;--mMainE:#1b2029;--mPark:#1b3123;--mParkE:#22402c;--mRiver:#15324a;--mRiverE:#1d4361;--mStFill:#1f252f;--mStInk:#f1f4f9;--mStEdge:#c8cfdb;--mName:#aab2c2;--mHalo:#161b23;--mDist:rgba(200,210,230,.14);--mLm:#5d6676;--mRv:#5f9fd0;--ghost:rgba(24,29,38,.92);--ghostE:#eef1f7}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Outfit,system-ui,sans-serif;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
button,input{font:inherit;color:inherit}
.bar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{flex:none}
.stat{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.stat b{font-weight:700;font-variant-numeric:tabular-nums}
.stat .sep{opacity:.5}
.stat .short{display:none}
.conn{width:10px;height:10px;border-radius:50%;background:#ffd34d;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.conn.ok{background:#4be08a}.conn.bad{background:#ff5a4f}
.ibtn{min-width:44px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:600;padding:0 12px;cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.24)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
#board{position:relative;overflow:hidden;background:var(--mOut);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#board.drag{cursor:grabbing}
#board>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(17,21,34,.12)}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(17,21,34,.95);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);width:max-content;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center;z-index:5}
.toast.on{opacity:1}
:root[data-theme=dark] .toast{background:rgba(236,240,247,.96);color:#111522}
.sheet{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:none}
.panes{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0}
.pane{display:flex;flex-direction:column;gap:12px}
.pane[hidden]{display:none}
h2,h3,p{margin:0}
.head{display:flex;align-items:center;gap:10px}
.head h2{font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.dot{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sub{color:var(--mute);font-size:15px}
.sub b{color:var(--ink);font-weight:600}
.alert{background:var(--alertBg);color:var(--alertInk);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600}
.news{background:var(--blue2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.news strong{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.c-taxi{background:var(--taxi);color:#231a00}.c-bus{background:var(--bus);color:#fff}.c-ug{background:var(--ug);color:#fff}.c-black{background:var(--blk);color:#fff}.c-double{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.zero{opacity:.35}
.btn{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--prih)}
.btn.big{min-height:52px;font-size:17px;border-radius:14px}
.btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.ibtn:focus-visible,.dest:focus-visible,input:focus-visible,.zoom button:focus-visible,.slot:focus-visible{outline:3px solid #f5b800;outline-offset:2px}
.grow{flex:1 1 auto}
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dest{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:62px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left}
.dest:hover{border-color:var(--blue);background:var(--blue2)}
.dest b{font-size:20px;font-weight:800;line-height:1}
.dest small{font-size:13px;color:var(--mute);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dest .tt{display:flex;gap:4px}
.dest .tt i{width:16px;height:6px;border-radius:3px;background:var(--c)}
.mine{display:flex;gap:8px;flex-wrap:wrap}
.mine button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;cursor:pointer;min-height:44px}
.mine button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mine button:disabled{opacity:.45}
.wait{display:flex;align-items:center;gap:10px;color:var(--mute)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sec-t{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-t small{font-size:13px;font-weight:400;color:var(--mute)}
.log{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;max-width:440px}
.cell{aspect-ratio:1;border-radius:8px;background:var(--soft);position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.cell i{position:absolute;top:2px;left:5px;font-style:normal;font-size:10px;font-weight:600;opacity:.7}
.cell.rev:not(.f){background:var(--card);border:2px dashed #b3b9c5}
.cell.f.rev{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--ink)}
.cell.next{outline:2.5px solid var(--blue);outline-offset:1px}
.cell.taxi{background:var(--taxi);color:#231a00}.cell.bus{background:var(--bus);color:#fff}.cell.ug{background:var(--ug);color:#fff}.cell.black{background:var(--blk);color:#fff}
.note{font-size:13px;color:var(--mute)}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--soft)}
.people li.act{box-shadow:inset 0 0 0 2px var(--blue)}
.people li.done{opacity:.6}
.people .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people .at{font-size:14px;color:var(--mute);white-space:nowrap}
.people .mini{grid-column:2/4;display:flex;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap;align-items:center}
.mini span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mini span::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.mini .take{margin-left:auto;min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:14px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:8px}
.page{position:fixed;inset:0;z-index:15;background:var(--card);overflow-y:auto;display:none}
.page.show{display:block}
.page .top{background:var(--bar);color:#fff;padding:max(18px,env(safe-area-inset-top,0px)) max(5vw,16px) 26px;position:relative;overflow:hidden}
.page .top h1{font-size:clamp(32px,7vw,48px);line-height:1.05;letter-spacing:-.02em;margin:10px 0 6px;font-weight:800;max-width:14ch}
.page .top p{opacity:.85;max-width:44ch;font-size:16px}
.page .top .tr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.page .top svg.deco{width:clamp(110px,30vw,220px);height:auto;flex:none;margin:-6px -6px -10px 0}
.page .in{max-width:640px;margin:0 auto}
.page .body{padding:22px max(5vw,16px) 40px;max-width:672px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
label{font-weight:600;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text]{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;padding:0 14px}
input.code{text-transform:uppercase;letter-spacing:.2em;font-weight:700;font-size:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}
.codebox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--soft);border-radius:16px;padding:16px}
.codebox .lbl{font-size:14px;color:var(--mute)}
.codebox .cd{font-size:clamp(40px,11vw,56px);font-weight:800;letter-spacing:.12em;line-height:1}
.qr{width:120px;height:120px;background:#fff;color:#000;border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%;display:block}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:60px;cursor:pointer;text-align:left;width:100%}
.slot:hover{border-color:var(--blue)}
.slot.mine{border-color:var(--blue);background:var(--blue2)}
.slot.taken{cursor:default}
.slot .pn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.slot .who{font-weight:700}
.slot .st{font-size:14px;color:var(--mute);white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:20px;min-width:1.5ch;text-align:center}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--blue);flex:none}
#md{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(17,21,34,.45);padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#md.show{display:flex}
.card{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:500px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(17,21,34,.3)}
.card h2{font-size:28px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.big-num{font-size:clamp(44px,12vw,64px);font-weight:800;line-height:1}
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ticket{min-height:78px;border:0;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 18px;-webkit-mask:radial-gradient(circle at 0 50%,#0000 9px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 9px,#000 10px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,#0000 9px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 9px,#000 10px) right/51% 100% no-repeat}
.ticket b{font-size:22px;font-weight:800;line-height:1}
.ticket span{font-size:13px;opacity:.85}
.ticket.t-taxi{background:var(--taxi);color:#231a00}.ticket.t-bus{background:var(--bus);color:#fff}.ticket.t-ug{background:var(--ug);color:#fff}.ticket.t-black{background:#000;color:#fff}
.ticket:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.st-num{font:700 18px Outfit,sans-serif;fill:var(--mStInk);text-anchor:middle;dominant-baseline:central}
.st-name{font:500 17px Outfit,sans-serif;fill:var(--mName);text-anchor:middle;paint-order:stroke;stroke:var(--mHalo);stroke-width:5px;stroke-linejoin:round}
svg.far .st-name{display:none}
svg.vfar .st-num{display:none}
.rv-t{font:500 30px Outfit,sans-serif;fill:var(--mRv);letter-spacing:.24em}
.dist{font:700 30px Outfit,sans-serif;fill:var(--mDist);letter-spacing:.32em;text-anchor:middle;dominant-baseline:central}
.cmp{font:800 22px Outfit,sans-serif;fill:var(--mLm);text-anchor:middle}
.pin-tag{font:700 16px Outfit,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.92);z-index:41;background:var(--card);color:var(--ink);border-radius:22px;padding:18px 28px;box-shadow:0 24px 70px rgba(0,0,0,.4);font-weight:800;font-size:clamp(26px,7vw,42px);line-height:1.1;text-align:center;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;max-width:calc(100% - 32px)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner small{display:block;font-size:16px;font-weight:500;color:var(--mute);margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .btn[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.pin-t{font:800 20px Outfit,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.tag{font:700 13px Outfit,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.hl{animation:pulse 1s ease-in-out infinite alternate}
.dim{opacity:.6}
@keyframes pulse{from{opacity:1}to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.hl,.spin{animation:none}.toast{transition:none}}
@media (min-width:900px){#md{align-items:center}.tabs{display:none!important}.pane[hidden]{display:flex!important}}
@media (max-width:899px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.sheet{border-left:0;border-top:1px solid var(--line);max-height:min(46vh,460px);max-height:min(46dvh,460px);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(17,21,34,.08);margin-top:-14px;position:relative;z-index:3}
.sheet.min .panes{display:none}
.tabs{display:flex;gap:4px;padding:8px 10px 0;align-items:center}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mute);cursor:pointer;min-height:40px}
.tabs button[aria-selected=true]{background:var(--soft);color:var(--ink)}
.tabs .tg{margin-left:auto;font-size:20px}
.panes{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:14px}
.head h2{font-size:22px}
.stat .long{display:none}.stat .short{display:inline}
}
@media (max-width:899px) and (orientation:landscape) and (max-height:560px){.app{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:none}.sheet{max-height:none;margin-top:0;border-radius:0;border-top:0;border-left:1px solid var(--line)}}
@media (max-width:420px){.logo span{display:none}#themeBtn{display:none}.stat{font-size:13px;gap:6px}}
</style>
</head>
<body>
<header class="bar">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#fff" stroke-width="5"/><rect x="1" y="12" width="28" height="6" rx="1" fill="#e1251b"/></svg><span>Mister X</span></div>
  <div class="stat" id="stat"></div>
  <span class="conn" id="conn" title="Verbindung"></span>
  <button class="ibtn" id="themeBtn" aria-label="Dunkel schalten"></button>
  <button class="ibtn" id="menuBtn">Menü</button>
</header>
<div class="app">
  <div id="board" aria-label="Spielbrett London">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoom">
      <button id="zin" aria-label="Hineinzoomen">+</button>
      <button id="zout" aria-label="Herauszoomen">−</button>
      <button id="zfit" aria-label="Ganze Karte" style="font-size:17px">⤢</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <section class="sheet" id="sheet">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="zug" aria-selected="true">Zug</button>
      <button role="tab" data-tab="log" aria-selected="false">Fahrtenbuch</button>
      <button role="tab" data-tab="team" aria-selected="false">Spieler</button>
      <button class="tg" id="sheetTg" aria-label="Bereich einklappen">▾</button>
    </div>
    <div class="panes">
      <div class="pane" id="p-zug"></div>
      <div class="pane" id="p-log" hidden></div>
      <div class="pane" id="p-team" hidden></div>
    </div>
  </section>
</div>
<div class="page" id="page"></div>
<div id="md"></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script>

  const head = isX ? (s.x.dbl === 2 ? 'Doppelzug, 2. Zug' : ui.arm ? 'Doppelzug, 1. Zug' : 'Dein Zug') : esc(dName(s, ui.sel));
  md(`<p class="sub">${head}</p><h2>Nach Station ${dest}${esc(nm(dest))}</h2><p>Womit fährst du?</p>
    <div class="tk">${opts.map(o => `<button class="ticket t-${o}" data-a="pick" data-t="${o}" data-d="${dest}" data-x="${isX ? 1 : 0}"><b>${TN[o]}</b><span>${o === 'black' ? 'verrät das Verkehrsmittel nicht · ' : ''}noch ${t[o]}</span></button>`).join('')}</div>
    <button class="btn" data-a="close" data-focus>Abbrechen</button>`);
}
const RULES = `<h2>So wird gespielt</h2><ol class="rules">
  <li>Jede Runde zieht zuerst <b>Mister X</b> – geheim auf seinem Handy. Alle anderen sehen nur, welches Ticket er benutzt hat.</li>
  <li>In den Runden <b>3, 8, 13, 18 und 24</b> muss er sich zeigen. Die Stelle bleibt als gestrichelte Nadel sichtbar.</li>
  <li>Danach ziehen die <b>Detektive</b>, in beliebiger Reihenfolge, jeder an seinem Gerät. Zwei Detektive dürfen nie auf derselben Station stehen.</li>
  <li>Taxi fährt über gelbe, Bus über grüne, U-Bahn über rote Linien. Jedes Ticket, das ein Detektiv benutzt, bekommt Mister X.</li>
  <li><b>Black Ticket:</b> gilt für jedes Verkehrsmittel und verrät nicht, welches. Nur damit kann Mister X das Themse-Boot (blau gestrichelt) nehmen.</li>
  <li><b>Doppelzug:</b> Mister X fährt zweimal hintereinander. Das zählt als zwei Runden.</li>
  <li>Die Detektive gewinnen, wenn einer auf die Station von Mister X zieht oder er nicht mehr ziehen kann. Mister X gewinnt, wenn er 24 Runden übersteht oder kein Detektiv mehr ziehen kann.</li>
  <li>Karte: mit einem Finger verschieben, mit zwei Fingern oder + und − zoomen.</li></ol><button class="btn pri big" data-a="close" data-focus>Verstanden</button>`;
function menu() {
  const inGame = room && room.state.phase !== 'lobby';
  md(`<h2>Menü</h2><div class="slots">
    <div class="field"><label>Darstellung</label><div class="seg">${[['auto', 'Wie System'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([k, l]) => `<button class="btn" data-a="theme" data-t="${k}" aria-pressed="${themePref === k}">${l}</button>`).join('')}</div></div>
    <button class="btn big" data-a="rules">Regeln</button>
    ${room ? '<button class="btn big" data-a="sharem">Mitspieler einladen</button>' : ''}
    ${inGame ? '<button class="btn big" data-a="fitc">Ganze Karte zeigen</button>' : ''}
    ${room && isMyX() && inGame ? '<button class="btn big" data-a="xmove">Mister X auf anderes Gerät</button>' : ''}
    ${room ? '<button class="btn big" data-a="home">Spiel verlassen</button>' : ''}
    <button class="btn pri big" data-a="close" data-focus>Schließen</button></div>`);
}
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
async function share(url, text) {
  try { if (navigator.share) { await navigator.share({ title: 'Mister X London', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert!'); } catch (e) { md(`<h2>Link</h2><p class="sub">Kopiere diesen Link:</p><input type="text" readonly value="${esc(url)}" onclick="this.select()"><button class="btn pri" data-a="close">Fertig</button>`); }
}

/* ================= actions ================= */
const ACT = {
  create() { const n = ($('#nameIn').value || '').trim(); if (!n) { toast('Bitte zuerst deinen Namen eingeben.'); $('#nameIn').focus(); return; } myName = n; LS.set(NKEY, n); createRoom(); },
  joincode() { const n = ($('#nameIn').value || '').trim(), c = ($('#codeIn').value || '').trim().toUpperCase(); if (!n) { toast('Bitte zuerst deinen Namen eingeben.'); return; } if (c.length !== 4) { toast('Der Code hat 4 Buchstaben.'); return; } myName = n; LS.set(NKEY, n); openRoom(c); },
  joinname() { const n = ($('#nameIn').value || '').trim(); if (!n) return toast('Bitte deinen Namen eingeben.'); myName = n; LS.set(NKEY, n); join(n); },
  cx() { if (!room.state.players[me]) return toast('Gib zuerst deinen Namen ein und tippe „Mitspielen“.'); claimX(); },
  cd(el) { if (!room.state.players[me]) return toast('Gib zuerst deinen Namen ein und tippe „Mitspielen“.'); if (room.state.xOwner === me) return toast('Mister X kann nicht zusätzlich Detektiv sein.'); claimD(+el.dataset.i); },
  detm() { setDet(room.state.d.length - 1); },
  detp() { setDet(room.state.d.length + 1); },
  start() { startGame(); },
  share() { share(shareUrl(), 'Spiel mit bei Mister X! Code: ' + room.code); },
  sharem() { md(`<h2>Mitspieler einladen</h2><div class="codebox"><div><div class="lbl">Spielcode</div><div class="cd">${esc(room.code)}</div></div><div class="qr">${qrSvg(shareUrl())}</div></div><button class="btn pri big" data-a="share">Link teilen</button><button class="btn" data-a="close" data-focus>Schließen</button>`); },
  rules() { md(RULES); },
  close() { md(''); },
  menu() { menu(); },
  fitc() { md(''); fit(); },
  home() { md(''); showHome(); },
  dest(el) { pickDest(+el.dataset.id); },
  pick(el) { md(''); const dest = +el.dataset.d, tt = el.dataset.t; if (el.dataset.x === '1') xMove(dest, tt); else dMove(ui.sel, dest, tt); },
  arm() { ui.arm = !ui.arm; render(); toast(ui.arm ? 'Doppelzug aktiv: Du ziehst gleich zweimal.' : 'Doppelzug abgewählt.'); },
  hidex() { ui.hideX = !ui.hideX; render(); },
  sel(el) { ui.sel = +el.dataset.i; render(); focusOn(room.state.d[ui.sel].pos); },
  undo() { undo(); },
  take(el) { const i = +el.dataset.i; md(`<h2>${esc(dName(room.state, i))} übernehmen?</h2><p class="sub">Dann steuerst du diesen Detektiv von deinem Gerät aus.</p><div class="row"><button class="btn grow" data-a="close" data-focus>Abbrechen</button><button class="btn pri grow" data-a="take2" data-i="${i}">Übernehmen</button></div>`); },
  take2(el) { md(''); takeOver(+el.dataset.i); },
  rematch() { rematch(); },
  restart() { restart(); },
  theme(el) { setTheme(el.dataset.t); menu(); },
  lobby() { backToLobby(); },
  xmove() {
    const raw = LS.get(KEYNAME(room.code)); if (!raw) return toast('Kein Schlüssel auf diesem Gerät.');
    const url = location.origin + location.pathname + location.search + '#' + room.code + '~x~' + me + '~' + raw;
    md(`<h2>Mister X übertragen</h2><p class="sub">Öffne diesen geheimen Link auf deinem neuen Gerät. Nicht an andere weitergeben – damit sieht man deine Position!</p><div class="qr" style="width:180px;height:180px;align-self:center">${qrSvg(url)}</div><button class="btn pri big" data-a="xcopy">Geheimen Link kopieren</button><button class="btn" data-a="close" data-focus>Schließen</button>`);
    ui.xUrl = url;
  },
  async xcopy() { try { await navigator.clipboard.writeText(ui.xUrl); toast('Geheimer Link kopiert.'); } catch (e) { toast('Kopieren nicht möglich – nutze den QR-Code.'); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.closest('#md') && performance.now() - shownAt < 320) return;
  const f = ACT[el.dataset.a]; if (f) f(el);
});
document.addEventListener('change', e => { if (e.target.id === 'helpIn') setHelp(e.target.checked); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#md').classList.contains('show')) md('');
  if (e.key === 'Enter' && e.target.id === 'codeIn') ACT.joincode();
  if (e.key === 'Enter' && e.target.id === 'nameIn' && room && room.state.phase === 'lobby') ACT.joinname();
});
$('#menuBtn').onclick = menu;
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => {
  ui.tab = b.dataset.tab;
  document.querySelectorAll('.tabs [data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['zug', 'log', 'team'].forEach(t => { $('#p-' + t).hidden = t !== ui.tab; });
  $('#sheet').classList.remove('min'); $('#sheetTg').textContent = '▾';
});
$('#sheetTg').onclick = () => { const m = $('#sheet').classList.toggle('min'); $('#sheetTg').textContent = m ? '▴' : '▾'; $('#sheetTg').setAttribute('aria-label', m ? 'Bereich ausklappen' : 'Bereich einklappen'); };

/* ================= boot ================= */
buildBoard();
requestAnimationFrame(fit);
(function boot() {
  let h = decodeURIComponent(location.hash.slice(1));
  if (h.includes('~x~')) {
    const [code, , pid, key] = h.split('~');
    if (code && pid && key) { LS.set('mrx-pid', pid); me = pid; LS.set('mrx-key-' + code.toUpperCase() + (params.get('p') ? '-' + me : ''), key); }
    h = code || '';
    history.replaceState(null, '', location.pathname + location.search + '#' + h);
  }
  if (!BE) { setConn('ERR'); return showHome(); }
  if (/^[A-Za-z]{4}$/.test(h)) openRoom(h); else showHome();
})();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (/^[A-Za-z]{4}$/.test(h) && (!room || room.code !== h.toUpperCase())) openRoom(h); });
if (LOCAL || params.get('p')) window.__mrx = { get room() { return room; }, get priv() { return priv; }, ui, ACT, legalNow, onStation, pickDest, myMovable };
}
</script>
</body>
</html>
